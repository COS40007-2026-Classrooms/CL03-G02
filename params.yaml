data:
  test_size: 0.2
  random_seed: 42
  target_column: 'Zone 1 Power Consumption'
  datetime_column: 'DateTime'

model:
  n_estimators: 100
  rf_max_depth: 20
  dt_max_depth: 10
  random_state: 42

evaluate:
  metrics_path: metrics.json

monitor:
  degradation_threshold: 0.15

lstm:
  sequence_len: 6
  epochs: 10
  batch_size: 32
  classes: 4
  early_stopping_patience: 10
  reduce_lr_patience: 5
