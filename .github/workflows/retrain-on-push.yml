name: Retrain ML Model - Tetouan Power Forecasting

on:
  push:
    branches: [main]

  schedule:
    - cron: '0 0 * * 0'

  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retraining even without drift detected'
        required: false
        default: false
        type: boolean

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions [Bot]"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure DVC remote credentials
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user $DAGSHUB_USERNAME
          dvc remote modify origin --local password $DAGSHUB_TOKEN

      - name: Pull artefacts from DVC remote
        run: dvc pull || echo "No existing artefacts to pull"

      - name: Merge new data into training set
        run: |
          if [ -f "data/new_data.csv" ]; then
            echo "NEW_DATA=true" >> $GITHUB_ENV
            python3 src/merge_new_data.py
          else
            echo "NEW_DATA=false" >> $GITHUB_ENV
          fi

      - name: Retrain model
        run: |
          if [ "${{ github.event.inputs.force_retrain }}" == "true" ]; then
            dvc repro --force
          else
            dvc repro train evaluate
          fi
          dvc exp save -n "ci-retrain-$(date +%Y%m%d-%H%M%S)"

      - name: Run drift detection
        run: |
          if [ -f "data/new_data.csv" ]; then
            python3 src/monitor.py
          fi

      - name: Push artefacts to DVC remote
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: dvc push

      - name: Commit updated metrics and reports
        run: |
          git add artifacts/metrics/ monitoring/ dvc.lock train/train.csv.dvc || true
          git diff --staged --quiet || git commit -m "update metrics and monitoring reports [skip ci]"
          git push origin main || echo "Nothing to push to origin"
          git pull --rebase https://${{ secrets.DAGSHUB_USERNAME }}:${{ secrets.DAGSHUB_TOKEN }}@dagshub.com/kaibroomfield314/CL03_G02.git main || true
          git push https://${{ secrets.DAGSHUB_USERNAME }}:${{ secrets.DAGSHUB_TOKEN }}@dagshub.com/kaibroomfield314/CL03_G02.git main || echo "Nothing to push to DagHub"

      - name: Generate HTML reports
        run: python3 src/generate_reports.py

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: model-results-${{ github.run_number }}
          path: |
            artifacts/metrics/
            monitoring/reports/
            logs/
            reports/

      - name: Deploy reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAT }}
          publish_dir: ./reports
