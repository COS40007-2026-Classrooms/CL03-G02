name: Retrain ML Model - Tetouan Power Forecasting

on:
  # Trigger 1: Automated on data push
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'train/**'
      - 'test/**'

  # Trigger 2: Scheduled (every Sunday at midnight)
  schedule:
    - cron: '0 0 * * 0'

  # Trigger 3: Manual trigger with optional force retrain
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retraining even without drift detected'
        required: false
        default: 'false'
        type: boolean

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      #  Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Cache pip to speed up runs
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install project dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc[http] scipy

