stages:
  train:
    cmd: python3 src/model.py
    deps:
      - src/model.py
      - train/train.csv
    outs:
      - artifacts/models/
      - artifacts/preprocessing/
      - artifacts/data/X_train.npy
      - artifacts/data/y_train.npy
      - artifacts/metrics/training_history.json

  evaluate:
    cmd: python3 src/evaluate.py
    deps:
      - src/evaluate.py
      - artifacts/models/random_forest.pkl
      - artifacts/models/decision_tree.pkl
      - artifacts/preprocessing/scaler.pkl
      - artifacts/preprocessing/feature_columns.json
      - test/test.csv
      - val/val.csv
    outs:
      - artifacts/data/X_test.npy
      - artifacts/data/y_test.npy
      - artifacts/data/X_val.npy
      - artifacts/data/y_val.npy
    metrics:
      - artifacts/metrics/evaluation_metrics.json:
          cache: false

  monitor:
    cmd: python3 src/monitor.py
    deps:
      - src/monitor.py
      - artifacts/models/random_forest.pkl
      - artifacts/preprocessing/scaler.pkl
      - artifacts/preprocessing/feature_columns.json
      - artifacts/data/X_train.npy
      - data/new_data.csv
    outs:
      - artifacts/data/X_new.npy:
          cache: false
      - monitoring/reports/drift_report.json:
          cache: false
    metrics:
      - artifacts/metrics/monitoring_metrics.json:
          cache: false

  lstm_train:
    cmd: python3 src/lstm_model.py
    deps:
      - src/lstm_model.py
      - train/train.csv
    outs:
      - artifacts/lstm/
    metrics:
      - artifacts/metrics/lstm_metrics.json:
          cache: false

  generate_reports:
    cmd: python3 src/generate_reports.py
    deps:
      - src/generate_reports.py
      - artifacts/metrics/training_history.json
      - artifacts/metrics/evaluation_metrics.json
      - artifacts/metrics/monitoring_metrics.json
      - artifacts/metrics/lstm_metrics.json
      - monitoring/reports/drift_report.json
    outs:
      - reports/performance_report.html:
          cache: false
      - reports/monitoring_dashboard.html:
          cache: false

metrics:
  - artifacts/metrics/evaluation_metrics.json
  - artifacts/metrics/lstm_metrics.json
